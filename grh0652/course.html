<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRH0652 · Módulo</title><script src="assets/course-config.js"></script><style>body{font-family:Inter,Segoe UI,Arial;background:#f4f7f9;margin:0;color:#202b33}.wrap{max-width:1100px;margin:auto;padding:28px}h1{color:#17365d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fff;border:1px solid #dce7ec;border-radius:18px;padding:20px}.badge{font-size:.8rem;font-weight:900}.active{color:#18744d}.pending{color:#9a6810}button{border:0;border-radius:10px;padding:11px 15px;background:#17365d;color:#fff;font-weight:800}button[disabled]{background:#9aa9b2}.bar{height:8px;background:#e7eef2;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#168c9e}.muted{color:#687983}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>0652 · Gestión de Recursos Humanos</h1><p>Itinerario completo por resultados de aprendizaje. Cada RA utiliza el mismo sistema de identificación, evidencias, evaluación criterial y recuperación.</p><div id="grid" class="grid"></div></div><script>
const student=localStorage.getItem('grh0652.student')||'';const token=localStorage.getItem('grh0652.studentKey')||'';if(!student||!token){location.href='index.html';throw new Error('Sesión de alumno requerida')}const g=document.getElementById('grid');GRH_COURSE.ras.forEach(r=>{const open=r.status==='active';g.insertAdjacentHTML('beforeend',`<article class="card"><div class="badge ${open?'active':'pending'}">${open?'DISPONIBLE':'PENDIENTE DE CONTENIDO'}</div><h2>${r.id} · ${r.title}</h2><p class="muted">${GRH_COURSE.raWeightsVerified&&Number.isFinite(r.weight)?('Ponderación del módulo: '+r.weight+'%'):'Ponderación del RA: pendiente de validar con la programación oficial'}</p><div class="bar"><i style="width:0%"></i></div><p><button ${open?'':'disabled'} onclick="location.href='player.html?unit=${r.unit}'">${open?'Abrir unidad':'Próximamente'}</button></p></article>`)});</script></body></html>

<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRH0652 · Reproductor SCORM</title>
<script src="assets/evidence-store.js"></script><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#0f1f30}.bar{height:56px;background:#17365d;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px}.title{font-weight:900}.spacer{flex:1}.status{font-size:.82rem;color:#cce8ee}.btn{border:0;border-radius:9px;padding:9px 12px;font:inherit;font-weight:800;cursor:pointer;background:#edf4f6;color:#17365d}.frame{height:calc(100% - 56px)}iframe{width:100%;height:100%;border:0;background:#fff}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{max-width:480px;background:#fff;border-radius:18px;padding:24px;color:#202b33}.actions{display:flex;gap:10px}.actions .btn{flex:1}.danger{background:#a73e3e;color:#fff}
@media(max-width:720px){.status.hide-sm{display:none}.title{font-size:.86rem}}
</style><script src="assets/scorm-api.js"></script></head>
<body><header class="bar"><button class="btn" id="back">← Aula</button><span class="title" id="unitTitle">Gestión de Recursos Humanos</span><span class="status hide-sm" id="studentLabel"></span><span class="spacer"></span><span class="status" id="live">SCORM listo</span><button class="btn" id="full">Pantalla completa</button></header>
<div class="frame"><iframe id="sco" src="about:blank" allow="fullscreen" title="SCORM UT1"></iframe></div>
<div class="modal" id="modal"><div class="box"><h2>¿Salir de la unidad?</h2><p>El reproductor solicitará al SCO que guarde su progreso antes de volver al aula.</p><div class="actions"><button class="btn" id="stay">Continuar</button><button class="btn danger" id="leave">Salir</button></div></div></div>
<script>
const qs=new URLSearchParams(location.search);const student=localStorage.getItem('grh0652.student')||'';const studentKey=localStorage.getItem('grh0652.studentKey')||'';if(!student||!studentKey){location.href='index.html';throw new Error('Sesión de alumno requerida')}const unit=(qs.get('unit')||'ut1').toLowerCase();if(qs.get('api'))localStorage.setItem('grh0652.api',qs.get('api'));localStorage.setItem('grh0652.student',student);window.SCORM_STUDENT_ID=student;document.getElementById('studentLabel').textContent=student;
const UNIT_TITLES={ut1:'UT1 · Gestión de la contratación laboral',ut2:'UT2 · Modificación, suspensión y extinción',ut3:'UT3 · Obligaciones empresariales con la Seguridad Social',ut4:'UT4 · Retribución, nóminas, cotización e IRPF'};if(!UNIT_TITLES[unit]){location.href='course.html?student='+encodeURIComponent(student);throw new Error('Unidad no válida')}document.getElementById('unitTitle').textContent=UNIT_TITLES[unit];document.title=UNIT_TITLES[unit]+' · SCORM';const courseId='GRH0652_'+unit.toUpperCase();window.SCORM_COURSE_ID=courseId;SCORM_API.configure({studentId:student,courseId});\n(async()=>{try{if(window.EVIDENCE){const r=await EVIDENCE.load(courseId);if(r&&r.state)localStorage.setItem('grh0652.sco.'+unit.toUpperCase()+'_COMPLETA_'+student,JSON.stringify(r.state))}}catch(e){}document.getElementById('sco').src='scorm/'+unit+'/index.html'})();
window.API=SCORM_API.api;
const modal=document.getElementById('modal');document.getElementById('back').onclick=()=>modal.classList.add('show');document.getElementById('stay').onclick=()=>modal.classList.remove('show');
document.getElementById('leave').onclick=()=>{try{document.getElementById('sco').contentWindow.postMessage({type:'scorm-save-exit'},location.origin)}catch(e){};SCORM_API.commit();location.href='index.html'};
window.exitCourse=()=>{SCORM_API.commit();location.href='index.html'};
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
window.addEventListener('scormcommit',e=>{const d=e.detail||{};document.getElementById('live').textContent=(d.status||'incomplete')+' · '+Math.round(Number(d.score)||0)+'% · guardado'});
</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f7f9"/><rect x="0" y="0" width="1200" height="170" fill="#17365d"/><rect x="0" y="164" width="1200" height="6" fill="#168c9e"/><text x="65" y="72" font-family="Arial" font-size="38" font-weight="700" fill="#fff">Contrato fijo-discontinuo</text><text x="65" y="118" font-family="Arial" font-size="20" fill="#cfe7ee">Indefinido con periodos de actividad e inactividad</text><g transform="translate(70 220)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">1</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Naturaleza</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">Es un contrato indefinido, no temporal.</div></foreignObject></g><g transform="translate(440 220)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">2</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Actividad</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">Trabajos estacionales o intermitentes recurrentes.</div></foreignObject></g><g transform="translate(810 220)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">3</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Inactividad</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">La relación no se extingue entre periodos.</div></foreignObject></g><g transform="translate(70 400)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">4</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Llamamiento</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">La reincorporación se articula conforme a criterios objetivos.</div></foreignObject></g><g transform="translate(440 400)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">5</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Documento</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">Debe formalizarse por escrito con los elementos exigibles.</div></foreignObject></g><g transform="translate(810 400)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">6</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Canarias</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">Especial interés en turismo, ocio, agricultura y servicios recurrentes.</div></foreignObject></g><text x="65" y="642" font-family="Arial" font-size="15" fill="#73838d">0652 · Gestión de Recursos Humanos · CFGS Administración y Finanzas · Canarias</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f7f9"/><rect x="0" y="0" width="1200" height="170" fill="#17365d"/><rect x="0" y="164" width="1200" height="6" fill="#168c9e"/><text x="65" y="72" font-family="Arial" font-size="38" font-weight="700" fill="#fff">Tiempo parcial y fijo-discontinuo</text><text x="65" y="118" font-family="Arial" font-size="20" fill="#cfe7ee">Dos conceptos distintos que pueden coexistir</text><g transform="translate(70 220)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">1</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Tiempo parcial</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">Define una jornada inferior a la comparable completa.</div></foreignObject></g><g transform="translate(440 220)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">2</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Fijo-discontinuo</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">Define una relación indefinida de actividad intermitente.</div></foreignObject></g><g transform="translate(810 220)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">3</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">No son sinónimos</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">Jornada y continuidad son dimensiones distintas.</div></foreignObject></g><g transform="translate(70 400)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">4</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Documento</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">Las horas y distribución deben concretarse cuando sea exigible.</div></foreignObject></g><g transform="translate(440 400)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">5</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Convenio</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">Puede añadir reglas sobre distribución y llamamiento.</div></foreignObject></g><g transform="translate(810 400)"><rect width="330" height="135" rx="18" fill="#ffffff" stroke="#d7e4ea" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#168c9e"/><text x="38" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">6</text><text x="72" y="38" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">Combinación</text><foreignObject x="72" y="50" width="235" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:15px Arial;color:#40515d;line-height:1.25">Puede existir fijo-discontinuo a tiempo parcial cuando proceda.</div></foreignObject></g><text x="65" y="642" font-family="Arial" font-size="15" fill="#73838d">0652 · Gestión de Recursos Humanos · CFGS Administración y Finanzas · Canarias</text></svg>
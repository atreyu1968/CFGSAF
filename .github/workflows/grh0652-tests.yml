name: GRH0652 tests
on:
  push:
    paths: ['grh0652/**']
  pull_request:
    paths: ['grh0652/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grh0652/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          GRH_TEACHER_TOKEN: ci-test-token
